name: Build Android

# Jalankan manual: GitHub > Actions > "Build Android" > Run workflow.
# Hasil (APK untuk install langsung, AAB untuk Play Store) ada di bagian "Artifacts" run tersebut.
on:
  # Otomatis jalan tiap ada perubahan di folder mobile/ (APK debug saja bila keystore belum diisi)
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Kosong = satu app untuk semua sekolah (halaman pilih sekolah). Isi slug (mis. sdn001balsel) hanya untuk app khusus satu sekolah."
        default: ""
      app_name:
        description: "Nama aplikasi di HP"
        default: "SI-PINTAR SD"
      app_id:
        description: "Package name (kosong = com.sipintarsd.app, atau com.sipintarsd.<slug> bila slug diisi)"
        default: ""
      base_url:
        description: "Alamat situs"
        default: "https://si-pintar-sd.vercel.app"
      version_code:
        description: "Nomor versi (naikkan tiap upload ke Play Store)"
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Atur identitas aplikasi
        env:
          SLUG: ${{ inputs.slug || '' }}
          APP_NAME: ${{ inputs.app_name || 'SI-PINTAR SD' }}
          APP_ID_IN: ${{ inputs.app_id || '' }}
          BASE_URL: ${{ inputs.base_url || 'https://si-pintar-sd.vercel.app' }}
          VCODE: ${{ inputs.version_code || '1' }}
        run: |
          APP_ID="${APP_ID_IN:-com.sipintarsd.${SLUG:-app}}"; export APP_ID
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
            c.appId=process.env.APP_ID; c.appName=process.env.APP_NAME;
            c.server.url=process.env.BASE_URL+(process.env.SLUG?"/"+process.env.SLUG:"");
            c.server.allowNavigation=[new URL(process.env.BASE_URL).host];
            fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));
          ' 
          sed -i "s/applicationId \".*\"/applicationId \"$APP_ID\"/; s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">$APP_NAME</string>#; s#<string name=\"title_activity_main\">.*</string>#<string name=\"title_activity_main\">$APP_NAME</string>#; s#<string name=\"package_name\">.*</string>#<string name=\"package_name\">$APP_ID</string>#; s#<string name=\"custom_url_scheme\">.*</string>#<string name=\"custom_url_scheme\">$APP_ID</string>#" android/app/src/main/res/values/strings.xml
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - run: npm ci || npm install
      - run: npx cap sync android

      - name: Siapkan keystore (opsional, untuk rilis Play Store)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK debug (untuk uji coba di HP)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build AAB release (untuk Play Store)
        if: env.KEYSTORE_FILE != ''
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ inputs.slug || 'semua' }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_FILE != ''
        with:
          name: aab-release-${{ inputs.slug || 'semua' }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
